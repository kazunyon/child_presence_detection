services:
  - type: web
    name: mamoru-bus-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: mamoru-bus-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mamoru-bus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kazunyon.github.io
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /var/data/mamoru-bus-uploads
      - key: TOKEN_EXPIRE_MINUTES
        value: '480'
      - key: NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_BASIC_ID
        value: '@408mrkbk'
      - key: LINE_OFFICIAL_ACCOUNT_NAME
        value: バナナ幼稚園
      - key: LINE_LINK_TOKEN_PEPPER
        generateValue: true
      - key: LINE_LINK_EXPIRE_HOURS
        value: '24'
      - key: LINE_ORGANIZATION_ID
        sync: false
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: NOTIFICATION_FEATURE_ENABLED
        value: 'false'
databases:
  - name: mamoru-bus-db
    plan: starter
